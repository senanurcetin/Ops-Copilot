name: Security Checks

# Scheduled/manual only; no deployment or production activation.
permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

jobs:
  security-headers:
    runs-on: ubuntu-latest
    name: Security Headers Check

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check security headers in next.config
        run: |
          if grep -q "Strict-Transport-Security" next.config.ts; then
            echo "HSTS header configured"
          else
            echo "HSTS header not configured"
            exit 1
          fi

  dependency-check:
    runs-on: ubuntu-latest
    name: Dependency Check

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run OWASP Dependency-Check
        # Scanner: official OWASP image pinned by digest (13.0.0). It runs as
        # the image's non-root user (uid 1000) with the checkout mounted
        # read-only (#118).
        # Data: the NVD database bundled in owasp/dependency-check-action,
        # which upstream rebuilds daily with the same 13.0.0 scanner. That
        # image is only `docker create`d so its data folder can be copied;
        # none of its code runs. Its resolved digest is printed for the log.
        env:
          DC_IMAGE: owasp/dependency-check:13.0.0@sha256:0e8f69ad5b00d62000937f4e57189812343f6903d9c83ee712012d51542a020a
          DC_DATA_IMAGE: owasp/dependency-check-action
        run: |
          docker pull --quiet "$DC_DATA_IMAGE"
          echo "NVD data image: $(docker inspect --format '{{index .RepoDigests 0}}' "$DC_DATA_IMAGE")"
          data_dir="$RUNNER_TEMP/dc-data"
          cid=$(docker create "$DC_DATA_IMAGE")
          docker cp "$cid:/usr/share/dependency-check/data" "$data_dir"
          docker rm "$cid" >/dev/null
          chmod -R a+rwX "$data_dir"
          mkdir -p reports
          chmod 0777 reports
          docker run --rm             --volume "$GITHUB_WORKSPACE:/src:ro"             --volume "$GITHUB_WORKSPACE/reports:/report"             --volume "$data_dir:/usr/share/dependency-check/data"             "$DC_IMAGE"             --noupdate             --scan /src             --project "Ops-Copilot"             --format "JSON"             --out /report             --enableExperimental             --exclude "**/node_modules/**"

      - name: Verify OWASP report integrity and declared NVD freshness
        if: always()
        run: node scripts/verify-dependencycheck-report.mjs

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: reports/
