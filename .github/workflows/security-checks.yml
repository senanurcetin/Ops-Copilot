name: Security Checks

# Scheduled/manual only; no deployment or production activation.
permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

jobs:
  security-headers:
    runs-on: ubuntu-latest
    name: Security Headers Check

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check security headers in next.config
        run: |
          if grep -q "Strict-Transport-Security" next.config.ts; then
            echo "HSTS header configured"
          else
            echo "HSTS header not configured"
            exit 1
          fi

  dependency-check:
    runs-on: ubuntu-latest
    name: Dependency Check

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run OWASP Dependency-Check
        # Official OWASP image pinned by digest (tag 13.0.0); it runs as the
        # image's non-root "dependencycheck" user. Replaces the Docker action
        # whose Dockerfile pulled a moving :latest tag and ran as root (#118).
        env:
          DC_IMAGE: owasp/dependency-check:13.0.0@sha256:0e8f69ad5b00d62000937f4e57189812343f6903d9c83ee712012d51542a020a
        run: |
          mkdir -p reports
          chmod 0777 reports
          docker run --rm             --volume "$GITHUB_WORKSPACE:/src:ro"             --volume "$GITHUB_WORKSPACE/reports:/report"             "$DC_IMAGE"             --scan /src             --project "Ops-Copilot"             --format "JSON"             --out /report             --enableExperimental             --exclude "**/node_modules/**"

      - name: Verify OWASP report integrity and declared NVD freshness
        if: always()
        run: node scripts/verify-dependencycheck-report.mjs

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: reports/
