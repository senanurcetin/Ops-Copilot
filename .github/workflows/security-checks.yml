name: Security Checks

# Scheduled/manual only; no deployment or production activation.
permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

jobs:
  security-headers:
    runs-on: ubuntu-latest
    name: Security Headers Check

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check security headers in next.config
        run: |
          if grep -q "Strict-Transport-Security" next.config.ts; then
            echo "HSTS header configured"
          else
            echo "HSTS header not configured"
            exit 1
          fi

  dependency-check:
    runs-on: ubuntu-latest
    name: Dependency Check

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c # verified upstream commit; base image remains mutable
        with:
          project: "Ops-Copilot"
          path: "."
          format: "JSON"
          args: >
            --enableExperimental
            --exclude node_modules

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
