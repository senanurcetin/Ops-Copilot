version: 2.1

# Non-deploying secondary CI. GitHub remains the source of truth.
# All Firebase and Genkit values here are fake CI placeholders.
jobs:
  node-quality:
    docker:
      - image: cimg/node:20.19
    resource_class: medium
    working_directory: ~/repo
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      FIREBASE_PROJECT_ID: "ci-placeholder"
      GEMINI_API_KEY: "ci-placeholder"
      NEXT_PUBLIC_FIREBASE_API_KEY: "ci-placeholder"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "ci-placeholder.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "ci-placeholder"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "ci-placeholder.firebasestorage.app"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:0000000000:web:placeholder"
    steps:
      - checkout
      - restore_cache:
          keys:
            - ops-copilot-npm-v1-{{ checksum "package-lock.json" }}
            - ops-copilot-npm-v1-
      - run:
          name: Install locked dependencies
          command: npm ci --no-audit --no-fund
      - save_cache:
          key: ops-copilot-npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: ESLint
          command: npm run lint
      - run:
          name: Next.js types and TypeScript
          command: npm run typecheck
      - run:
          name: Unit and GitHub auditor tests
          command: npm run test:ci
          no_output_timeout: 15m
      - run:
          name: Next.js production build
          command: npm run build
          no_output_timeout: 15m

workflows:
  verify:
    jobs:
      - node-quality
